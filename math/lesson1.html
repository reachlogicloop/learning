<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Functional Math: Vocational</title>
<style>
  body{margin:0;font-family:Verdana,Arial,sans-serif;background:#eaf4ff;color:#1b2a41}
  header{background:#2b7de9;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-size:20px}
  #bar{height:12px;background:#cfe3fb}#fill{height:100%;width:0;background:#34c759;transition:.3s}
  main{max-width:820px;margin:20px auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 4px 14px #0002;min-height:380px}
  .tag{display:inline-block;background:#ffd23f;border-radius:20px;padding:4px 16px;font-weight:bold;margin-bottom:12px}
  h1,h2{margin:8px 0 16px}
  .big{font-size:30px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:14px}
  .opt{display:block;width:100%;text-align:left;font-size:26px;padding:16px;margin:10px 0;background:#f2f6fb;border:3px solid #9bb8dd}
  .opt:hover{background:#dcebff}.opt.sel{border-color:#2b7de9;background:#cfe3ff}
  .opt.good{background:#c9f5d2;border-color:#34c759}.opt.bad{background:#ffd6d6;border-color:#e5484d}
  #nav{display:flex;justify-content:space-between;max-width:820px;margin:0 auto 30px;padding:0 10px}
  .nb{font-size:26px;padding:14px 36px;background:#34c759;color:#fff}
  .nb.back{background:#8aa0bd}.nb:disabled{background:#c5ccd6;cursor:not-allowed}
  .spk{font-size:28px;background:#ffd23f;padding:8px 18px;margin-right:8px}
  .fb{font-size:26px;font-weight:bold;margin-top:14px;min-height:40px}
  .tbl{font-size:26px;border-collapse:collapse}.tbl td{border:3px solid #2b7de9;padding:8px 20px}
  .check{font-size:24px;padding:12px 28px;background:#2b7de9;color:#fff;margin-top:10px}
  svg{cursor:crosshair;background:#fff}
  label{font-size:18px}
</style>
</head>
<body>
<header><span>📦 Functional Math: Vocational</span>
<label><input type="checkbox" id="auto" checked> Auto-read</label></header>
<div id="bar"><div id="fill"></div></div>
<main id="page"></main>
<div id="nav">
  <button class="nb back" id="back">⬅ Back</button>
  <button class="nb" id="next">Next ➡</button>
</div>

<script>
// ===== CONTENT: edit here to add or change pages =====
const pages = [
 {type:"info", tag:"Welcome", title:"Let's Learn About Work!", text:"Today you will learn words and skills for a job. First, vocabulary. Then, concepts. Then, practice. Last, a test. Take your time!"},

 {type:"info", tag:"Vocabulary", title:"Aisle 🛒", text:"An aisle is a long walkway between shelves. Workers use aisle numbers to find things."},
 {type:"info", tag:"Vocabulary", title:"Barcode ||||", text:"A barcode is a code of numbers and lines. A scanner reads it to tell what a package is."},
 {type:"info", tag:"Vocabulary", title:"Expired ⏰", text:"Expired means too old to use. Look for the date on the package. If today is after the date, it is expired."},
 {type:"info", tag:"Vocabulary", title:"Close 🔒", text:"At a store, close means the time the store shuts. Workers also clean up and put things away."},

 {type:"info", tag:"Concept", title:"Finding the Aisle", text:"Use the chart to match the item to its aisle number. Find the word, then read the number next to it.",
   table:[["Accents","42"],["Bathroom","47"],["Bedding","37"],["Furniture","90"],["Kitchenware","20"]]},
 {type:"info", tag:"Concept", title:"Counting Digits", text:"A digit is one number. To check a code, count every digit. Do not skip any. A 16-digit code has exactly 16 numbers."},
 {type:"info", tag:"Concept", title:"Half Full", text:"Half full means the middle. The line is halfway between the bottom and the top."},
 {type:"info", tag:"Concept", title:"Reading a Date", text:"Compare the date on the package with today's date. If the package date is before today, it is expired."},

 {type:"info", tag:"Practice", title:"Practice Time! ⭐", text:"Now you try. You will see if you are right. It is OK to make mistakes."},
 {mode:"practice", type:"mc", tag:"Practice", q:"Which aisle has Kitchenware?", table:[["Accents","42"],["Bathroom","47"],["Bedding","37"],["Furniture","90"],["Kitchenware","20"]],
   opts:["Aisle 20","Aisle 37","Aisle 42","Aisle 90"], ans:0},
 {mode:"practice", type:"mc", tag:"Practice", q:"Which code has 16 digits?  Count carefully.",
   opts:["1234 5678 1234 5678","1234 5678 1234 567","1234 5678 1234 56789"], ans:0},
 {mode:"practice", type:"bucket", tag:"Practice", q:"Click on the bucket to draw a line for half full."},
 {mode:"practice", type:"mc", tag:"Practice", q:"Today is MAR 5. The milk says MAR 1. Is the milk expired?",
   opts:["👍 Not expired","👎 Expired"], ans:1},

 {type:"info", tag:"Test", title:"Test Time! 📝", text:"Now show what you know. You will not see if you are right until the end. Do your best!"},
 {mode:"test", type:"mc", tag:"Test", q:"What aisle of the warehouse will you find bedding to fill an order?", table:[["Accents","42"],["Bathroom","47"],["Bedding","37"],["Furniture","90"],["Kitchenware","20"]],
   opts:["Aisle 20","Aisle 37","Aisle 42","Aisle 47","Aisle 90"], ans:1},
 {mode:"test", type:"mc", tag:"Test", q:"Erika's job is to scan a 16-digit code on packages. Choose the 16-digit code.",
   opts:["5 60543201 0007","50160543201000701","5016054320100701"], ans:2},
 {mode:"test", type:"bucket", tag:"Test", q:"Click on the bucket to draw a line to mark \"half full.\""},
 {mode:"test", type:"mc", tag:"Test", q:"Today is FEB 15. The package says FEB 10. Is it expired or not?",
   opts:["👍 Not expired","👎 Expired"], ans:1},
 {mode:"test", type:"mc", tag:"Test", q:"Jana's schedule says she is working 3pm to close. What does \"close\" mean?",
   opts:["Whenever customers stop coming in","The time the store closes and everything is clean and put away","When the sun sets"], ans:1},

 {type:"result"}
];

// ===== ENGINE =====
let i=0; const answers={}; const done={};
const $=id=>document.getElementById(id);
const testQs=pages.filter(p=>p.mode==="test");

function speak(t){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.rate=0.85; speechSynthesis.speak(u);
}
function readText(p){
  if(p.type==="info") return p.title.replace(/[^\w\s']/g,"")+". "+p.text;
  if(p.type==="result") return $("page").innerText;
  let t=p.q+" ";
  if(p.opts) t+=p.opts.map((o,k)=>"Choice "+"ABCDE"[k]+". "+o+".").join(" ");
  return t;
}
function tableHTML(t){return t?"<table class='tbl'>"+t.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join("")+"</table><br>":"";}

function render(){
  const p=pages[i], m=$("page"); let h="";
  $("fill").style.width=(i/(pages.length-1)*100)+"%";
  $("back").disabled=i===0;
  $("next").disabled=false;
  $("next").textContent=i===pages.length-1?"Done ✅":"Next ➡";
  if(p.type==="info"){
    h=`<span class="tag">${p.tag}</span><h1>${p.title}</h1><p class="big">${p.text}</p>${tableHTML(p.table)}
       <button class="spk" onclick="speak(readText(pages[i]))">🔊 Read to me</button>`;
  } else if(p.type==="result"){
    let s=0; testQs.forEach(q=>{ if(isCorrect(q)) s++; });
    h=`<span class="tag">Results</span><h1>🎉 Great job!</h1>
       <p class="big">You got <b>${s} out of ${testQs.length}</b> correct.</p>
       <p class="big">${s>=4?"Wow! You are a super worker! ⭐":"Good try! Let's practice again. 💪"}</p>
       <button class="check" onclick="i=0;render()">Start over</button>`;
    $("next").disabled=true;
  } else {
    h=`<span class="tag">${p.tag}</span><p class="big"><button class="spk" onclick="speak(readText(pages[i]))">🔊</button>${p.q}</p>${tableHTML(p.table)}`;
    if(p.type==="mc"){
      p.opts.forEach((o,k)=>{
        let c="opt"; const chosen=answers[i]===k;
        if(chosen) c+=" sel";
        if(p.mode==="practice"&&done[i]){ if(k===p.ans) c+=" good"; else if(chosen) c+=" bad"; }
        h+=`<button class="${c}" onclick="pick(${k})">${"ABCDE"[k]}. ${o}</button>`;
      });
    } else {
      const y=answers[i];
      h+=`<svg id="bk" width="260" height="300" viewBox="0 0 260 300" onclick="bucketClick(event)">
        <path d="M40 60 L60 270 Q130 295 200 270 L220 60 Z" fill="#6fb1ff" stroke="#1d5fb8" stroke-width="5"/>
        <ellipse cx="130" cy="60" rx="90" ry="14" fill="#a9d1ff" stroke="#1d5fb8" stroke-width="5"/>
        ${y!=null?`<line x1="35" x2="225" y1="${y}" y2="${y}" stroke="#e5484d" stroke-width="6"/>`:""}</svg>`;
    }
    if(p.mode==="practice") h+=`<div class="fb" id="fb"></div>`;
    if(p.mode==="practice"&&p.type==="bucket") h+=`<button class="check" onclick="checkBucket()">Check ✔</button>`;
    // lock Next until answered
    $("next").disabled = answers[i]==null;
  }
  m.innerHTML=h;
  if(p.mode==="practice"&&done[i]) showFB();
  if($("auto").checked) speak(readText(p));
  window.scrollTo(0,0);
}
function isCorrect(q){
  const idx=pages.indexOf(q), a=answers[idx];
  if(q.type==="mc") return a===q.ans;
  return a!=null && a>=130 && a<=215; // middle of bucket (top 60, bottom ~280)
}
function pick(k){
  const p=pages[i]; answers[i]=k;
  if(p.mode==="practice"){ done[i]=true; }
  render();
}
function bucketClick(e){
  const r=$("bk").getBoundingClientRect();
  answers[i]=Math.round((e.clientY-r.top)*300/r.height);
  const p=pages[i]; if(p.mode==="test") render(); else { done[i]=false; render(); }
}
function checkBucket(){ done[i]=true; showFB(); render(); }
function showFB(){
  const p=pages[i], ok=isCorrect(p);
  const f=$("fb"); if(!f) return;
  f.style.color=ok?"#1e9e45":"#c0262b";
  f.textContent=ok?"✅ Yes! Great job!":"❌ Not quite. Look at the Concept again and try next time.";
  if(ok||p.type==="mc") $("next").disabled=false;
  if($("auto").checked) speak(ok?"Yes! Great job!":"Not quite. Good try.");
}
$("next").onclick=()=>{ if(i<pages.length-1){i++;render();} };
$("back").onclick=()=>{ if(i>0){i--;render();} };
render();
</script>
</body>
</html>
