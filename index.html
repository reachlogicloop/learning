<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson</title>
<style>
  body{margin:0;font-family:Verdana,Arial,sans-serif;background:#eaf4ff;color:#1b2a41}
  header{background:#2b7de9;color:#fff;padding:12px 20px;font-size:22px}
  #bar{height:12px;background:#cfe3fb}#fill{height:100%;width:0;background:#34c759;transition:.3s}
  main{max-width:820px;margin:20px auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 4px 14px #0002;min-height:380px}
  .tag{display:inline-block;background:#ffd23f;border-radius:20px;padding:4px 16px;font-weight:bold;margin-bottom:12px}
  h1{margin:8px 0 16px}
  .big{font-size:30px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:14px}
  .opt{display:block;width:100%;text-align:left;font-size:26px;padding:16px;margin:10px 0;background:#f2f6fb;border:3px solid #9bb8dd}
  .opt:hover{background:#dcebff}.opt.sel{border-color:#2b7de9;background:#cfe3ff}
  .opt.good{background:#c9f5d2;border-color:#34c759}.opt.bad{background:#ffd6d6;border-color:#e5484d}
  #nav{display:flex;justify-content:space-between;max-width:820px;margin:0 auto 30px;padding:0 10px}
  .nb{font-size:26px;padding:14px 36px;background:#34c759;color:#fff}
  .nb.back{background:#8aa0bd}.nb:disabled{background:#c5ccd6;cursor:not-allowed}
  .spk{font-size:28px;background:#ffd23f;padding:8px 18px;margin-right:12px;vertical-align:middle}
  .fb{font-size:26px;font-weight:bold;margin-top:14px;min-height:40px}
  .tbl{font-size:22px;border-collapse:collapse;width:100%}.tbl td{border:3px solid #2b7de9;padding:8px 14px}
  .tbl td:first-child{background:#fff6d6;font-weight:bold;width:30%}
  .check{font-size:24px;padding:12px 28px;background:#2b7de9;color:#fff;margin-top:10px}
  .clk{display:block;margin:10px 0}
</style>
</head>
<body>
<header id="hdr"></header>
<div id="bar"><div id="fill"></div></div>
<main id="page"></main>
<div id="nav">
  <button class="nb back" id="back">⬅ Back</button>
  <button class="nb" id="next">Next ➡</button>
</div>

<script>
/* =====================================================
   CONFIG: CHANGE ONLY THIS SECTION FOR A NEW LESSON
   info(tag, title, text, table?, clock?)
   mc(mode, question, [options], answerNumber, table?, clock?)
   table = [["Row label","Row info"], ...]
   clock = [hour, minute]
   ===================================================== */
const EVENT = [
  ["📚 Event","LIBRARY EVENT: Life of a Social Media Influencer"],
  ["📍 Where","Logan Room"],
  ["📅 When","July 15, 4:00–5:00pm (6-week series, presentation 4/6)"],
  ["👥 Age Group","Young Adults"],
  ["ℹ️ About","Explore the life of a social media influencer. Learn about technology, networking, and audience-building skills to create a profitable, successful online career."],
  ["✍️ Sign Up","Registration not required"]
];

const CONFIG = {
  title: "📚 Functional Reading: Event Information",
  passScore: 4,

  pages: [
    info("Welcome","Let's Learn to Read Event Information!","Today you will learn words and skills for reading a flyer about an event. First vocabulary, then concepts, then practice, then a test. Tap the speaker button to hear any page."),

    // ---- VOCABULARY ----
    info("Vocabulary","Event 🎉","An event is something that happens at a certain place and time."),
    info("Vocabulary","Series 🔢","A series is a group of events that happen one after another."),
    info("Vocabulary","Registration ✍️","Registration means signing up. 'Registration not required' means you do not have to sign up."),
    info("Vocabulary","Young Adults 🧑","Young adults are teenagers and people in their early twenties. The event is made for this age group."),
    info("Vocabulary","Social Media Influencer 📱","An influencer is a person who shares posts online. Many people follow and watch them."),

    // ---- CONCEPTS ----
    info("Concept","Reading an Event Flyer","A flyer tells you what, where, when, and who. Look for each one in the flyer.",EVENT),
    info("Concept","Where and When","WHERE tells the place. WHEN tells the date and time. 4:00–5:00pm means from 4pm to 5pm."),
    info("Concept","What Does 4/6 Mean?","4/6 means 4 out of 6. This is the 4th talk in a series of 6 talks."),
    info("Concept","Four Kinds of Questions","SUMMARY: What is the main idea? DETAIL: Find the answer in the flyer. IDENTIFY FACTS: Find the exact facts. TRANSFER: Use what you learned in real life."),

    // ---- PRACTICE ----
    info("Practice","Practice Time! ⭐","Now you try. You will see if you are right. It is OK to make mistakes."),
    mc("practice","DETAIL: Where is the event?",["Logan Room","The gym","The cafeteria"],0,EVENT),
    mc("practice","DETAIL: Who is the event for?",["Little kids","Young adults","Grandparents"],1,EVENT),
    mc("practice","IDENTIFY FACTS: Do you have to sign up?",["👍 Yes","👎 No"],1,EVENT),
    mc("practice","SUMMARY: What is the event about?",["Being a social media influencer","Cooking dinner","Playing soccer"],0,EVENT),
    mc("practice","What does 4/6 mean?",["It is the 4th talk out of 6","It costs $4","It starts at 4:06"],0,EVENT),

    // ---- TEST ----
    info("Test","Test Time! 📝","Now show what you know. You will see your score at the end. Do your best!"),
    mc("test","SUMMARY: What is happening at the library?",["A talk about the life of a social media influencer","A book sale","A movie night"],0,EVENT),
    mc("test","DETAIL: What day is this event?",["July 4","July 15","June 15"],1,EVENT),
    mc("test","IDENTIFY FACTS: When does this event occur?",["July 15, 4:00–5:00pm","July 15, 5:00–6:00pm","July 4, 4:00–5:00pm"],0,EVENT),
    mc("test","TRANSFER INFORMATION: How would someone find more events like this?",["Check the library website or ask a librarian","Look in the refrigerator","Guess"],0),
    mc("test","IDENTIFY FACTS: Do you need to register for this event?",["👍 Yes","👎 No, registration is not required"],1,EVENT),

    {type:"result"}
  ]
};

/* ============ HELPERS (do not change) ============ */
function info(tag,title,text,table,clock){return {type:"info",tag,title,text,table,clock};}
function mc(mode,q,opts,ans,table,clock){return {mode,type:"mc",tag:mode==="test"?"Test":"Practice",q,opts,ans,table,clock};}

/* ============ ENGINE (do not change) ============ */
const pages=CONFIG.pages; let i=0; const answers={}, done={};
const $=id=>document.getElementById(id);
const testQs=pages.filter(p=>p.mode==="test");
document.title=CONFIG.title.replace(/^[^\w]+/,""); $("hdr").textContent=CONFIG.title;

function speak(t){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.rate=0.85; speechSynthesis.speak(u);
}
function readText(p){
  if(p.type==="info") return p.title.replace(/[^\w\s'&]/g,"")+". "+p.text;
  if(p.type==="result") return $("page").innerText;
  let t=p.q+" ";
  if(p.opts) t+=p.opts.map((o,k)=>"Choice "+"ABCDE"[k]+". "+o+".").join(" ");
  return t;
}
function tableHTML(t){return t?"<table class='tbl'>"+t.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")+"</table><br>":"";}
function clockHTML(c){
  if(!c) return "";
  const [h,m]=c, ha=((h%12)+m/60)*30, ma=m*6;
  let s=`<svg class="clk" width="240" height="240" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="92" fill="#fff" stroke="#1d5fb8" stroke-width="6"/>`;
  for(let n=1;n<=12;n++){
    const a=n*30*Math.PI/180;
    s+=`<text x="${100+70*Math.sin(a)}" y="${100-70*Math.cos(a)+7}" font-size="20" font-weight="bold" text-anchor="middle">${n}</text>`;
  }
  s+=`<line x1="100" y1="100" x2="100" y2="52" stroke="#1b2a41" stroke-width="8" stroke-linecap="round" transform="rotate(${ha} 100 100)"/>
      <line x1="100" y1="100" x2="100" y2="30" stroke="#e5484d" stroke-width="5" stroke-linecap="round" transform="rotate(${ma} 100 100)"/>
      <circle cx="100" cy="100" r="6" fill="#1b2a41"/></svg>`;
  return s;
}
function isCorrect(q){ return answers[pages.indexOf(q)]===q.ans; }

function render(){
  const p=pages[i], m=$("page"); let h="";
  $("fill").style.width=(i/(pages.length-1)*100)+"%";
  $("back").disabled=i===0;
  $("next").textContent=i===pages.length-1?"Done ✅":"Next ➡";
  $("next").disabled=false;
  if(p.type==="info"){
    h=`<span class="tag">${p.tag}</span>
       <h1><button class="spk" onclick="speak(readText(pages[i]))">🔊</button>${p.title}</h1>
       <p class="big">${p.text}</p>${clockHTML(p.clock)}${tableHTML(p.table)}`;
  } else if(p.type==="result"){
    let s=0; testQs.forEach(q=>{ if(isCorrect(q)) s++; });
    h=`<span class="tag">Results</span><h1>🎉 Great job!</h1>
       <p class="big">You got <b>${s} out of ${testQs.length}</b> correct.</p>
       <p class="big">${s>=CONFIG.passScore?"Wow! You are a reading expert! ⭐":"Good try! Let's practice again. 💪"}</p>
       <button class="check" onclick="i=0;render()">Start over</button>`;
    $("next").disabled=true;
  } else {
    h=`<span class="tag">${p.tag}</span>
       <p class="big"><button class="spk" onclick="speak(readText(pages[i]))">🔊</button>${p.q}</p>${clockHTML(p.clock)}${tableHTML(p.table)}`;
    p.opts.forEach((o,k)=>{
      let c="opt"; const chosen=answers[i]===k;
      if(chosen) c+=" sel";
      if(p.mode==="practice"&&done[i]){ if(k===p.ans) c+=" good"; else if(chosen) c+=" bad"; }
      h+=`<button class="${c}" onclick="pick(${k})">${"ABCDE"[k]}. ${o}</button>`;
    });
    if(p.mode==="practice") h+=`<div class="fb" id="fb"></div>`;
    $("next").disabled = (p.mode==="practice") ? !done[i] : answers[i]==null;
  }
  m.innerHTML=h;
  if(p.mode==="practice"&&done[i]) showFB();
  window.scrollTo(0,0);
}
function pick(k){ answers[i]=k; if(pages[i].mode==="practice") done[i]=true; render(); }
function showFB(){
  const ok=isCorrect(pages[i]), f=$("fb"); if(!f) return;
  f.style.color=ok?"#1e9e45":"#c0262b";
  f.textContent=ok?"✅ Yes! Great job!":"❌ Not quite. Look at the flyer again.";
  $("next").disabled=false;
}
$("next").onclick=()=>{ if(i<pages.length-1){i++;render();} };
$("back").onclick=()=>{ if(i>0){i--;render();} };
render();
</script>
</body>
</html>
