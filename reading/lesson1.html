<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson</title>
<style>
  body{margin:0;font-family:Verdana,Arial,sans-serif;background:#eaf4ff;color:#1b2a41}
  header{background:#2b7de9;color:#fff;padding:12px 20px;font-size:22px}
  #bar{height:12px;background:#cfe3fb}#fill{height:100%;width:0;background:#34c759;transition:.3s}
  main{max-width:820px;margin:20px auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 4px 14px #0002;min-height:380px}
  .tag{display:inline-block;background:#ffd23f;border-radius:20px;padding:4px 16px;font-weight:bold;margin-bottom:12px}
  h1{margin:8px 0 16px}
  .big{font-size:30px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:14px}
  .opt{display:block;width:100%;text-align:left;font-size:26px;padding:16px;margin:10px 0;background:#f2f6fb;border:3px solid #9bb8dd}
  .opt:hover{background:#dcebff}.opt.sel{border-color:#2b7de9;background:#cfe3ff}
  .opt.good{background:#c9f5d2;border-color:#34c759}.opt.bad{background:#ffd6d6;border-color:#e5484d}
  #nav{display:flex;justify-content:space-between;max-width:820px;margin:0 auto 30px;padding:0 10px}
  .nb{font-size:26px;padding:14px 36px;background:#34c759;color:#fff}
  .nb.back{background:#8aa0bd}.nb:disabled{background:#c5ccd6;cursor:not-allowed}
  .spk{font-size:28px;background:#ffd23f;padding:8px 18px;margin-right:12px;vertical-align:middle}
  .fb{font-size:26px;font-weight:bold;margin-top:14px;min-height:40px}
  .tbl{font-size:22px;border-collapse:collapse;width:100%}.tbl td{border:3px solid #2b7de9;padding:8px 14px}
  .tbl td:first-child{background:#fff6d6;font-weight:bold;width:28%}
  .check{font-size:24px;padding:12px 28px;background:#2b7de9;color:#fff;margin-top:10px}
</style>
</head>
<body>
<header id="hdr"></header>
<div id="bar"><div id="fill"></div></div>
<main id="page"></main>
<div id="nav">
  <button class="nb back" id="back">⬅ Back</button>
  <button class="nb" id="next">Next ➡</button>
</div>

<script>
/* =====================================================
   CONFIG: CHANGE ONLY THIS SECTION FOR A NEW LESSON
   info(tag, title, text, table?)
   mc(mode, question, [options], answerNumber, table?)
   table = [["Row label","Row info"], ...]
   ===================================================== */
const LABEL = [
  ["💊 Uses","Provides short-term relief of minor sore throat and cough discomfort."],
  ["⚠️ Warnings","Consult a doctor right away if a sore throat is intense, continues beyond 2 days, or comes with fever, headache, rash, swelling, nausea, or vomiting. These may be signs of a serious issue."]
];

const CONFIG = {
  title: "💊 Functional Reading: Medicine Safety (1)",
  passScore: 4,

  pages: [
    info("Welcome","Let's Learn to Read a Medicine Label!","Today you will learn words and skills for reading a medicine label. First vocabulary, then concepts, then practice, then a test. Tap the speaker button to hear any page."),

    // ---- VOCABULARY ----
    info("Vocabulary","Uses 💊","Uses tell you why people take the medicine. It tells what the medicine helps."),
    info("Vocabulary","Warnings ⚠️","Warnings tell you when to be careful or when to get help."),
    info("Vocabulary","Relief 😌","Relief means the pain or sickness feels better."),
    info("Vocabulary","Consult 🩺","Consult means to ask. Consult a doctor means ask a doctor."),
    info("Vocabulary","Fever 🌡️","A fever is when your body is too hot. It is a sign you may be sick."),

    // ---- CONCEPTS ----
    info("Concept","Reading a Medicine Label","A label has parts. USES tells why to take it. WARNINGS tells when to get help.",LABEL),
    info("Concept","Reading the Uses","Look at the USES. This tells when someone would take the medicine. Here it is for a minor sore throat and cough."),
    info("Concept","Reading the Warnings","Warnings list signs of a bigger problem. If you see these signs, ask a doctor right away."),
    info("Concept","Staying Safe","Always read the label first. Ask an adult, a doctor, or a pharmacist if you are not sure. Keep medicine in a safe place."),

    // ---- PRACTICE ----
    info("Practice","Practice Time! ⭐","Now you try. You will see if you are right. It is OK to make mistakes."),
    mc("practice","What does USES tell you?",["Why people take the medicine","How much it costs","What color it is"],0,LABEL),
    mc("practice","Is a fever a sign to ask a doctor?",["👍 Yes","👎 No"],0,LABEL),
    mc("practice","A sore throat lasts 3 days. What should you do?",["Ask a doctor","Do nothing","Take more medicine"],0,LABEL),
    mc("practice","What does relief mean?",["Feeling better","Feeling worse","Feeling sleepy"],0),
    mc("practice","SUMMARY: This medicine is for a minor ____.",["Sore throat and cough","Broken arm","Headache only"],0,LABEL),

    // ---- TEST ----
    info("Test","Test Time! 📝","Now show what you know. You will see your score at the end. Do your best!"),
    mc("test","SUMMARY: When would someone use this medicine?",["For a minor sore throat and cough","For a broken bone","For a stomachache"],0,LABEL),
    mc("test","DETAIL: When should someone stop taking this medicine and ask a doctor?",["If the sore throat continues beyond 2 days or comes with fever","If they feel better right away","If it is Monday"],0,LABEL),
    mc("test","INFERENCE: Where would someone store this medicine?",["In a safe place like a medicine cabinet","On the playground","In the bathtub"],0),
    mc("test","EVALUATE: How would someone know if this medicine is working?",["The sore throat and cough feel better","They feel more sick","Nothing changes"],0),
    mc("test","DETAIL: After how many days of a sore throat should you ask a doctor?",["More than 2 days","After 1 hour","After 1 year"],0,LABEL),

    {type:"result"}
  ]
};

/* ============ HELPERS (do not change) ============ */
function info(tag,title,text,table){return {type:"info",tag,title,text,table};}
function mc(mode,q,opts,ans,table){return {mode,type:"mc",tag:mode==="test"?"Test":"Practice",q,opts,ans,table};}

/* ============ ENGINE (do not change) ============ */
const pages=CONFIG.pages; let i=0; const answers={}, done={};
const $=id=>document.getElementById(id);
const testQs=pages.filter(p=>p.mode==="test");
document.title=CONFIG.title.replace(/^[^\w]+/,""); $("hdr").textContent=CONFIG.title;

function speak(t){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.rate=0.85; speechSynthesis.speak(u);
}
function readText(p){
  if(p.type==="info") return p.title.replace(/[^\w\s'&]/g,"")+". "+p.text;
  if(p.type==="result") return $("page").innerText;
  let t=p.q+" ";
  if(p.opts) t+=p.opts.map((o,k)=>"Choice "+"ABCDE"[k]+". "+o+".").join(" ");
  return t;
}
function tableHTML(t){return t?"<table class='tbl'>"+t.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")+"</table><br>":"";}
function isCorrect(q){ return answers[pages.indexOf(q)]===q.ans; }

function render(){
  const p=pages[i], m=$("page"); let h="";
  $("fill").style.width=(i/(pages.length-1)*100)+"%";
  $("back").disabled=i===0;
  $("next").textContent=i===pages.length-1?"Done ✅":"Next ➡";
  $("next").disabled=false;
  if(p.type==="info"){
    h=`<span class="tag">${p.tag}</span>
       <h1><button class="spk" onclick="speak(readText(pages[i]))">🔊</button>${p.title}</h1>
       <p class="big">${p.text}</p>${tableHTML(p.table)}`;
  } else if(p.type==="result"){
    let s=0; testQs.forEach(q=>{ if(isCorrect(q)) s++; });
    h=`<span class="tag">Results</span><h1>🎉 Great job!</h1>
    finishLesson();
       <p class="big">You got <b>${s} out of ${testQs.length}</b> correct.</p>
       <p class="big">${s>=CONFIG.passScore?"Wow! You are a label-reading expert! ⭐":"Good try! Let's practice again. 💪"}</p>
       <button class="check" onclick="i=0;render()">Start over</button>`;
    $("next").disabled=true;
  } else {
    h=`<span class="tag">${p.tag}</span>
       <p class="big"><button class="spk" onclick="speak(readText(pages[i]))">🔊</button>${p.q}</p>${tableHTML(p.table)}`;
    p.opts.forEach((o,k)=>{
      let c="opt"; const chosen=answers[i]===k;
      if(chosen) c+=" sel";
      if(p.mode==="practice"&&done[i]){ if(k===p.ans) c+=" good"; else if(chosen) c+=" bad"; }
      h+=`<button class="${c}" onclick="pick(${k})">${"ABCDE"[k]}. ${o}</button>`;
    });
    if(p.mode==="practice") h+=`<div class="fb" id="fb"></div>`;
    $("next").disabled = (p.mode==="practice") ? !done[i] : answers[i]==null;
  }
  m.innerHTML=h;
  if(p.mode==="practice"&&done[i]) showFB();
  window.scrollTo(0,0);
}
function pick(k){ answers[k===undefined?i:i]=k; if(pages[i].mode==="practice") done[i]=true; render(); }
function showFB(){
  const ok=isCorrect(pages[i]), f=$("fb"); if(!f) return;
  f.style.color=ok?"#1e9e45":"#c0262b";
  f.textContent=ok?"✅ Yes! Great job!":"❌ Not quite. Look at the label again.";
  $("next").disabled=false;
}
$("next").onclick=()=>{ if(i<pages.length-1){i++;render();} };
$("back").onclick=()=>{ if(i>0){i--;render();} };
render();
</script>
  <script src="../progress.js"></script>

<script>

// Start lesson tracking when student opens lesson
MLCProgress.startLesson("math", "lesson1");

// When student completes the lesson
function finishLesson() {
    MLCProgress.completeLesson("math", "lesson1");

    alert("Great job! Lesson completed ⭐");
}

// When student submits quiz
function submitQuiz(score, totalQuestions) {

    const stars = MLCProgress.saveScore(
        "math",
        "lesson1",
        score,
        totalQuestions
    );

    alert("You earned " + stars + " stars!");
}

</script>
  
</body>
</html>
